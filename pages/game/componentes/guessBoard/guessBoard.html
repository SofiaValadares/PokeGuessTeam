<section class="game-card game-card--board">
    <div class="game-card__header">
        <p class="game-card__eyebrow">Campos de adivinhação</p>
        <h2 id="gameGuessTitle">Vez do jogador</h2>
        <p id="gameGuessSubtitle" class="game-card__description">Cada card abaixo representa um dos 6 pokémons do adversário e mostra as pistas já descobertas sobre ele.</p>
    </div>

    <div class="game-turn-banner">
        <span class="game-pill game-pill--accent">Turno atual</span>
        <strong id="gameCurrentTurnLabel">Jogador Principal</strong>
        <small id="gameRoundStatus">Partida em andamento</small>
        <span id="gameGuessedCount" class="game-pill game-pill--muted">0 palpites únicos</span>
    </div>

    <section class="game-opponent-panel">
        <div class="game-clue-panel__header">
            <h3>O que já sabemos</h3>
            <span>6 slots de pistas</span>
        </div>
        <ul id="gameOpponentSlots" class="game-opponent-slots"></ul>
    </section>

    <form id="gameGuessForm" class="game-guess-form">
        <label class="game-guess-form__field" for="gameGuessSearch">
            <span>Buscar pokémon para o chute</span>
            <input id="gameGuessSearch" type="search" list="gameGuessOptions" placeholder="Ex.: Pikachu" autocomplete="off">
        </label>
        <datalist id="gameGuessOptions"></datalist>
        <button id="gameGuessButton" type="submit">Confirmar palpite</button>
    </form>

    <p id="gameGuessFeedbackStatus" class="game-feedback-status is-hidden" role="status" aria-live="polite"></p>
</section>
