<section class="register-card register-card--sprite">
	<div class="register-section-heading">
		<p class="register-section-kicker">Criação de perfil</p>
		<h2>Escolha seu parceiro inicial</h2>
	</div>

	<div class="selected-sprite-card">
		<img
			id="registerSelectedSpriteImage"
			class="selected-sprite-card__image"
			src="assets/player/001P.png"
			alt="Sprite selecionado do jogador"
		>
		<div class="selected-sprite-card__content">
			<p id="registerSelectedSpriteName" class="selected-sprite-card__name">Bulbasaur</p>
		</div>
	</div>

	<ul class="sprite-selector-list" id="registerSpriteList">
		<li>
			<button class="sprite-option" type="button" data-sprite-id="001P" data-sprite-name="Bulbasaur" data-sprite-path="assets/player/001P.png">
				<img src="assets/player/001P.png" alt="Bulbasaur">
				<span>Bulbasaur</span>
			</button>
		</li>
		<li>
			<button class="sprite-option" type="button" data-sprite-id="002P" data-sprite-name="Charmander" data-sprite-path="assets/player/002P.png">
				<img src="assets/player/002P.png" alt="Charmander">
				<span>Charmander</span>
			</button>
		</li>
		<li>
			<button class="sprite-option" type="button" data-sprite-id="003P" data-sprite-name="Squirtle" data-sprite-path="assets/player/003P.png">
				<img src="assets/player/003P.png" alt="Squirtle">
				<span>Squirtle</span>
			</button>
		</li>
	</ul>
</section>
