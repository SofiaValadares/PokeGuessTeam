<section class="team-page team-page--right">
    <div class="team-sidebar-card">
        <div class="team-sidebar-card__player">
            <div class="team-sidebar-card__avatar-wrap">
                <img id="teamSidebarAvatar" src="assets/player/001P.png" alt="Avatar do jogador">
            </div>
            <div>
                <p id="teamSidebarRole" class="team-sidebar-card__eyebrow"></p>
                <h2 id="teamSidebarName">Treinador</h2>
                <p id="teamSidebarSubtitle" class="team-sidebar-card__description">Escolha 6 pokémon para avançar.</p>
            </div>
        </div>
        <div class="team-sidebar-card__summary-strip">
            <span>Selecionados</span>
            <strong id="teamSidebarCount">0 / 6</strong>
        </div>

        <section class="team-sidebar-team">
            <div class="team-sidebar-team__header">
                <h3>Time selecionado</h3>
                <span>Prévia atual</span>
            </div>
            <ul id="teamSidebarTeamList" class="team-sidebar-team__list"></ul>
        </section>

        <p id="teamSidebarStatus" class="team-sidebar-status is-hidden" role="status" aria-live="polite"></p>

        <div class="team-sidebar-actions">
            <button id="teamSidebarPrimaryButton" type="button">Próximo</button>
            <button id="teamSidebarBackButton" type="button" class="button-secondary">Voltar</button>
        </div>
    </div>
</section>
