<section class="home-card home-card--history">
    <div class="home-card__header">
        <p class="home-card__eyebrow">Home</p>
        <h2>Histórico de partidas</h2>
        <p class="home-card__description">
            Acompanhe suas últimas partidas locais e remova entradas quando quiser limpar o histórico.
        </p>
    </div>

    <div class="home-table-wrap">
        <table class="history-table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Oponente</th>
                    <th>Resultado</th>
                    <th>Placar</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="homeHistoryTableBody"></tbody>
        </table>
    </div>

    <p id="homeHistoryEmpty" class="home-empty-state is-hidden">
        Nenhuma partida registrada ainda.
    </p>
</section>
