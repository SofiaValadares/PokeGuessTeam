<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokeTeamGuess - Jogatina</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pages/guess.css">
</head>
<body class="guess-page">
  <div class="pokedex">
    <div class="pokedex-header">
      <div class="pokedex-header-light"></div>
      <div class="header-info">
        <h1 class="pokedex-header-title">POKéTEAMGUESS</h1>
        <p class="player-name" id="battle-player-name">TREINADOR</p>
      </div>
      <div class="pokedex-header-buttons">
        <div class="pokedex-header-button red"></div>
        <div class="pokedex-header-button yellow"></div>
        <div class="pokedex-header-button green"></div>
      </div>
    </div>

    <div class="pokedex-main-area">
      <div class="pokedex-screen-left guess-left-screen">
        <div class="teams-two-cols">
          <div class="team-block">
            <h3>🎯 TIME ADVERSÁRIO (ANOTAÇÕES E CHUTE)</h3>
            <div class="enemy-team-grid" id="enemy-team-grid"></div>
          </div>

          <div class="team-block">
            <h3>🛡️ SEU TIME (O QUE O ADVERSÁRIO JÁ ACERTOU)</h3>
            <div class="self-team-grid" id="self-team-grid"></div>
          </div>
        </div>

        <div class="guess-box">
          <div class="guess-box-header">
            <p id="candidates-count">Selecione um slot para ver opções de chute</p>
            <div class="guess-header-actions">
              <button id="close-guess-btn" class="guess-mini-btn">Fechar Seleção</button>
              <button id="clear-filters-btn" class="guess-mini-btn">Limpar Filtros</button>
            </div>
          </div>
          <div class="candidate-grid" id="candidate-grid"></div>
        </div>

        <div class="guess-action-row">
          <select id="enemy-guess-select"></select>
          <button id="confirm-guess-btn" class="guess-confirm-btn">CHUTAR SLOT</button>
          <button id="clear-guess-btn" class="guess-confirm-btn guess-clear-btn">Limpar Chute</button>
        </div>
        <p class="guess-feedback" id="guess-feedback"></p>
      </div>

      <div class="pokedex-screen-right guess-right-screen">
        <div class="reserved-panel">
          <div class="battle-banner" id="battle-banner">
            <div class="match-result-panel" id="match-result-panel" style="display:none;">
              <h4 id="match-result-title"></h4>
              <p id="match-result-description"></p>
            </div>
            <div class="trainer-side">
              <img id="player-battle-avatar" alt="Treinador jogador" class="trainer-sprite trainer-back">
            </div>
            <div class="trainer-side opponent">
              <img id="opponent-battle-avatar" alt="Treinador adversário" class="trainer-sprite trainer-front">
            </div>
          </div>
        </div>

        <div class="free-notes-wrapper">
          <h4>📝 Anotações Livres</h4>
          <textarea id="free-notes" placeholder="Escreva aqui qualquer estratégia, suspeita ou informação importante..."></textarea>
          <button id="save-notes-btn" class="guess-mini-btn">Salvar Anotações</button>
          <span id="notes-status"></span>
          <button id="finish-match-btn" class="guess-finish-btn" disabled>Finalizar Partida</button>
          <button id="give-up-btn" class="guess-finish-btn guess-give-up-btn">Desistir da Partida</button>
        </div>
      </div>
    </div>

    <div class="pokedex-button-area">
      <div class="pokedex-dpad"></div>
      <div class="pokedex-action-buttons">
        <button class="pokedex-action-button">B</button>
        <button class="pokedex-action-button">A</button>
      </div>
    </div>
  </div>

  <script src="js/user.js"></script>
  <script src="js/pokemonData.js"></script>
  <script src="js/guessPage.js"></script>
</body>
</html>
