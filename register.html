<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTeamGuess - Registro</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pages/register.css">
</head>
<body class="register-page">
  <div class="pokedex-container">
    <!-- Pokédex Top -->
    <div class="pokedex-top">
      <div class="pokedex-light"></div>
      <h1 class="pokedex-title">POKéTEAMGUESS</h1>
      <div class="pokedex-buttons">
        <div class="button-light red"></div>
        <div class="button-light yellow"></div>
        <div class="button-light green"></div>
      </div>
    </div>

    <!-- Pokédex Middle (Horizontal Layout) -->
    <div class="pokedex-middle">
      <!-- Pokédex Screen (Left) -->
      <div class="pokedex-screen">
        <div class="registration-form">
          <h2>REGISTRO DE TREINADOR</h2>
          
          <!-- Nickname Input -->
          <div class="form-group">
            <label>APELIDO DO TREINADOR</label>
            <input 
              type="text" 
              id="nickname-input" 
              placeholder="Seu apelido aqui..."
              maxlength="20"
            >
            <span class="char-counter"><span id="char-count">0</span>/20</span>
          </div>

          <!-- Avatar Selection -->
          <div class="avatar-selection">
            <label>SELECIONE SEU AVATAR</label>
            <div class="avatar-buttons">
              <button class="avatar-button" data-avatar="Spr_FRLG_Leaf.png">
                <img src="assets/players/Spr_FRLG_Leaf.png" alt="Leaf">
                <span>LEAF</span>
              </button>
              <button class="avatar-button" data-avatar="Spr_FRLG_Red.png">
                <img src="assets/players/Spr_FRLG_Red.png" alt="Red">
                <span>RED</span>
              </button>
            </div>
          </div>

          <p class="status-message" id="status-message"></p>
        </div>
      </div>

      <!-- Avatar Preview Sidebar (Right) -->
      <div class="avatar-preview-sidebar">
        <!-- Selected Avatar Preview -->
        <div class="avatar-preview" id="avatar-preview">
          <p>NENHUM AVATAR SELECIONADO</p>
        </div>

        <!-- Buttons -->
        <div class="buttons-section">
          <button class="register-button" id="register-btn">CONFIRMAR REGISTRO</button>
          <button class="logout-button" id="logout-btn" style="display:none;">LOGOUT</button>
        </div>
      </div>
    </div>

    <!-- Pokédex Bottom -->
    <div class="pokedex-bottom">
      <div class="d-pad"></div>
      <div class="action-buttons">
        <button class="ab-button">B</button>
        <button class="ab-button">A</button>
      </div>
    </div>
  </div>

  <script src="js/user.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
