<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTeamGuess</title>
    <link rel="stylesheet" href="pokedex.css">
    <link rel="stylesheet" href="../../ds/variables.css">
    <link rel="stylesheet" href="../../ds/global.css">
</head>
<body>
    <div class="pokedex">
        <div class="pokedex-header">
            <div class="pokedex-header-light"></div>
            <div class="header-info">
                <h1 class="pokedex-header-title">POKéTEAMGUESS</h1>
            </div>
            <div class="pokedex-header-buttons">
                <div class="pokedex-header-button red"></div>
                <div class="pokedex-header-button yellow"></div>
                <div class="pokedex-header-button green"></div>
            </div>
        </div>

        <div class="pokedex-main-area">
            <div class="pokedex-screen-left">
                <!-- Conteúdo da tela esquerda -->
            </div>

            <div class="pokedex-screen-right">
                <!-- Conteúdo da tela direita -->
            </div>
        </div>

        <div class="pokedex-button-area">
            <div class="pokedex-dpad"></div>
            <p class="sprite-credit">Sprites por artistas da PMD SpriteCollab — <a href="/sprits_credits.txt" target="_blank">Ver créditos das sprites</a></p>
        </div>
    </div>

    <div id="pokedex-root"></div>
</body>
</html>
