<section class="team-selector-card">
	<div class="team-selector-card__header">
		<div>
			<p class="team-selector-card__eyebrow">Time escolhido</p>
			<h3>Monte um time com 6 pokémon</h3>
		</div>
		<p class="team-selector-card__description">Clique em um pokémon para adicionar. Você também pode remover ou sortear um time.</p>
	</div>

	<ul id="teamSelectorSlots" class="team-selector-slots"></ul>

	<div class="team-selector-actions">
		<button id="teamSelectorRandomButton" type="button">Time aleatório</button>
		<button id="teamSelectorClearButton" type="button" class="button-secondary">Limpar time</button>
	</div>
</section>
